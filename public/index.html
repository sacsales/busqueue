<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus queue</title>
</head>
<body>
  <section id="routeScreen" hidden>
  <h1>Choose a route</h1>
  <div id="routeList"></div>
</section>

<section id="timeScreen" hidden>
  <button id="backBtn">← Routes</button>
  <h1 id="routeTitle"></h1>
  <p>Choose a departure time</p>
  <div id="timeList"></div>
</section>

<section id="resultScreen" hidden>
  <h1 id="resultTitle"></h1>
  <p id="resultMsg"></p>
  <p id="codeBlock" hidden>
  Your code: <strong id="codeValue" style="font-size:1.8rem; letter-spacing:0.15em;"></strong>
  </p>
  <button id="cancelBtn" hidden>Leave the queue</button>
  <button id="resultBackBtn" hidden>← Routes</button>
  <p id="resultAlert" hidden style="background:#fff3cd; padding:12px; border-radius:8px;">
  <strong>Your bus is about 15 minutes away. Head to the station.</strong>
  </p>

</section>


<section id="phoneScreen">
    <h1>Enter your phone number</h1>
    <input id = "phone" type="tel" placeholder="+129030283">
    <button id="phoneBtn">Continue</button>
    <p id="phoneMsg"></p>
</section>

</body>

<script>
function show(screenId) {
  for (const id of ['phoneScreen', 'routeScreen', 'timeScreen', 'resultScreen']) {
    document.getElementById(id).hidden = (id !== screenId);
  }
}

function showResult(title, message, canCancel, alerted) {
  document.getElementById('codeBlock').hidden = true;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = message;
  document.getElementById('resultAlert').hidden = !alerted;
  document.getElementById('cancelBtn').hidden = !canCancel;
  document.getElementById('resultBackBtn').hidden = canCancel;
  show('resultScreen');
}

async function checkSpot() {
  const { data: spot } = await post('/api/queue/mine', { phone: phone });

  if (spot) {
    showResult(
      "You're in line",
      spot.route_name + ' at ' + spot.depart_time + ': you are #' + spot.position + ', with ' + spot.ahead + ' ahead of you.',
      true,
      spot.alerted
    );
    document.getElementById('codeBlock').hidden = false;
    document.getElementById('codeValue').textContent = spot.code;
    if (!pollTimer) pollTimer = setInterval(checkSpot, 10000);
  } else {
    stopPolling();
    show('routeScreen');
  }
}



async function setPhone() {
  const cleaned = document.getElementById('phone').value.replace(/[^\d+]/g, '');

  if (!/^\+?\d{8,15}$/.test(cleaned)) {
    document.getElementById('phoneMsg').textContent = 'Enter a valid phone number, with country code';
    return;
  }

  phone = cleaned;
  document.getElementById('phoneMsg').textContent = '';
  await checkSpot();
}

async function post(url, body) {
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return { ok: response.ok, status: response.status, data: await response.json() };
}


async function joinQueue(timeId) {
  const result = await post('/api/times/' + timeId + '/queue', { phone: phone });

  if (result.ok || result.status === 409) {
    await checkSpot();
  } else {
    showResult('Could not join', result.data.error, false);
  }
}


async function loadTimes(route) {
  const response = await fetch('/api/routes/' + route.id + '/times');
  const times = await response.json();

  document.getElementById('routeTitle').textContent = route.name;

  const list = document.getElementById('timeList');
  list.innerHTML = '';
  for (const t of times) {
    const button = document.createElement('button');
    button.textContent = t.depart_time;
    button.onclick = () => joinQueue(t.id);
    list.appendChild(button);
  }

  show('timeScreen');
}

async function cancelSpot() {
  if (!confirm('Leave the queue?')) return;
  stopPolling();
  await post('/api/queue/cancel', { phone: phone });
  show('routeScreen');
}

let phone = '';
let pollTimer = null;

function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
}





async function loadRoutes() {
  const response = await fetch('/api/routes');
  const routes = await response.json();

  const list = document.getElementById('routeList');
  for (const route of routes) {
    const button = document.createElement('button');
    button.textContent = route.name;
    button.onclick = () => loadTimes(route);
    list.appendChild(button);
  }
}

loadRoutes();
document.getElementById('backBtn').onclick = () => show('routeScreen');
document.getElementById('phoneBtn').onclick = setPhone;
document.getElementById('resultBackBtn').onclick = () => show('routeScreen');
document.getElementById('cancelBtn').onclick = cancelSpot;



</script>
</html>
