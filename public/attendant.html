<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendant</title>
</head>
<body>
  <h1>Check a ride</h1>
  <input id="token" type="password" placeholder="Staff token">
  <input id="code" placeholder="Rider's code" autocapitalize="characters" autocomplete="off">
  <button id="lookupBtn">Look up</button>
  <button id="forgetBtn">Forget token on this device</button>
  <p id="msg"></p>

  <div id="details" hidden>
    <h2 id="dVerdict"></h2>
    <p id="dRoute"></p>
    <p id="dPosition"></p>
    <p id="dPhone"></p>
  </div>

  <button id="boardBtn" hidden>Mark as boarded</button>

  <script> 

  async function staffPost(url) {
  const response = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-driver-token': document.getElementById('token').value
    },
    body: JSON.stringify({ code: document.getElementById('code').value })
  });
  return { ok: response.ok, data: await response.json() };
}

function verdict(d) {
  if (!d.is_today) return 'NOT VALID: ticket is for ' + d.service_date;
  if (d.status === 'cancelled') return 'NOT VALID: rider left the queue';
  if (d.status === 'boarded') return 'ALREADY BOARDED';
  return 'VALID: waiting in line';
}

async function lookup() {
  const { ok, data } = await staffPost('/api/attendant/lookup');
  const box = document.getElementById('details');

  if (!ok) {
    box.hidden = true;
    document.getElementById('msg').textContent = data.error;
    return;
  }

  try { localStorage.setItem('staffToken', document.getElementById('token').value); } catch (e) {}


  document.getElementById('msg').textContent = '';
  document.getElementById('dVerdict').textContent = verdict(data);
  document.getElementById('dRoute').textContent = data.route_name + ' at ' + data.depart_time;
  document.getElementById('dPosition').textContent = 'Position #' + data.position + ' (' + data.ahead + ' ahead)';
  document.getElementById('dPhone').textContent = 'Phone ends in ' + data.phone_last4;
  document.getElementById('boardBtn').hidden = !(data.is_today && data.status === 'waiting');
  box.hidden = false;
}

async function board() {
  const { ok, data } = await staffPost('/api/attendant/board');
  if (!ok) {
    document.getElementById('msg').textContent = data.error;
    return;
  }
  await lookup();
}

document.getElementById('lookupBtn').onclick = lookup;
document.getElementById('boardBtn').onclick = board;
document.getElementById('code').onkeydown = (e) => { if (e.key === 'Enter') lookup(); };

document.getElementById('forgetBtn').onclick = () => {
  try { localStorage.removeItem('staffToken'); } catch (e) {}
  document.getElementById('token').value = '';
  document.getElementById('msg').textContent = 'Token forgotten.';
};

try {
  const saved = localStorage.getItem('staffToken');
  if (saved) document.getElementById('token').value = saved;
} catch (e) {}

const linkCode = new URLSearchParams(location.search).get('code');
if (linkCode) {
  document.getElementById('code').value = linkCode;
  if (document.getElementById('token').value) {
    lookup();
  } else {
    document.getElementById('msg').textContent = 'Enter the staff token to see this ride.';
  }
}



</script>
</body>
</html>
